<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d">
  <!-- Palette commune : fond #12102e > #1f1a5c > #2b1650 · Claude #D97757 / clair #F0A586 · Sonnet #8B7BFF · agents #4FD6B4 · texte #FFFFFF / #C9C4F2 · bordures #3A3480 · coins 14-18 -->
  <title id="t">Flux de travail de la pipeline</title>
  <desc id="d">Toi vers Sonnet, qui délègue à lecteur, executant, testeur et chercheur ; les agents rendent un rapport court et Sonnet vérifie. L'architecte Opus est appelé aux déclencheurs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12102e"/>
      <stop offset="0.6" stop-color="#1a1650"/>
      <stop offset="1" stop-color="#2b1650"/>
    </linearGradient>
    <linearGradient id="cSon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#352c92"/><stop offset="1" stop-color="#241e66"/>
    </linearGradient>
    <linearGradient id="cAg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17404a"/><stop offset="1" stop-color="#142f3c"/>
    </linearGradient>
    <linearGradient id="cArc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2636"/><stop offset="1" stop-color="#341b33"/>
    </linearGradient>
    <linearGradient id="cNeu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252060"/><stop offset="1" stop-color="#1b1748"/>
    </linearGradient>
    <radialGradient id="haloV">
      <stop offset="0" stop-color="#8B7BFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#05040f" flood-opacity="0.45"/>
    </filter>
    <filter id="gl" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="aV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#8B7BFF"/>
    </marker>
    <marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#4FD6B4"/>
    </marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#D97757"/>
    </marker>
