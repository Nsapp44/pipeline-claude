  </defs>

  <rect width="1000" height="480" rx="18" fill="url(#bg)"/>
  <circle cx="306" cy="250" r="200" fill="url(#haloV)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="0.5" y="0.5" width="999" height="479" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- en-tête -->
  <g font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="32" y="48" font-size="21" font-weight="700" fill="#ffffff">Comment circule le travail</text>
    <text x="32" y="72" font-size="13.5" fill="#c9c4f2">Le fil principal délègue, les agents rendent un rapport court, puis il vérifie avant de conclure.</text>
  </g>

  <!-- liaisons -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <g stroke="#8B7BFF" stroke-opacity="0.75" marker-end="url(#aV)">
      <path d="M148 250 L192 250"/>
      <path d="M416 250 C468 250 462 130 512 130"/>
      <path d="M416 250 C468 250 462 210 512 210"/>
      <path d="M416 250 C468 250 462 290 512 290"/>
      <path d="M416 250 C468 250 462 370 512 370"/>
    </g>
    <g stroke="#4FD6B4" stroke-opacity="0.6" marker-end="url(#aT)">
      <path d="M726 130 C772 130 766 250 812 250"/>
      <path d="M726 210 C772 210 766 250 812 250"/>
      <path d="M726 290 C772 290 766 250 812 250"/>
      <path d="M726 370 C772 370 766 250 812 250"/>
    </g>
    <path d="M306 324 L306 368" stroke="#D97757" stroke-dasharray="5 6" marker-end="url(#aO)">
      <animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="318" y="351" font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F0A586">aux déclencheurs</text>

  <!-- cartes -->
  <g font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Toi -->
    <g filter="url(#sh)">
      <rect x="32" y="218" width="116" height="64" rx="14" fill="url(#cNeu)" stroke="#3A3480" stroke-width="1.5"/>
    </g>
    <circle cx="64" cy="250" r="17" fill="#ffffff" fill-opacity="0.08"/>
    <g transform="translate(52 238)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4.5 20.5 C4.5 16 8 14 12 14 C16 14 19.5 16 19.5 20.5"/>
    </g>
    <text x="92" y="256" font-size="18" font-weight="700" fill="#ffffff">Toi</text>

    <!-- Sonnet -->
    <g filter="url(#sh)">
      <rect x="196" y="176" width="220" height="148" rx="16" fill="url(#cSon)" stroke="#8B7BFF" stroke-width="2"/>
    </g>
    <circle cx="234" cy="214" r="22" fill="#12102e" fill-opacity="0.6" stroke="#D97757" stroke-opacity="0.55"/>
    <g transform="translate(234 214) scale(0.4)" fill="#D97757"><use href="#star"/></g>
    <text x="266" y="211" font-size="22" font-weight="800" fill="#ffffff">Sonnet</text>
    <text x="266" y="230" font-size="12.5" font-weight="600" fill="#cfc8ff" letter-spacing="0.5">FIL PRINCIPAL</text>
    <path d="M214 252 L398 252" stroke="#8B7BFF" stroke-opacity="0.35"/>
    <text x="214" y="280" font-size="14" fill="#e4e0ff">Conçoit, tranche</text>
    <text x="214" y="302" font-size="14" fill="#e4e0ff">et vérifie le résultat</text>

    <!-- agents -->
    <g filter="url(#sh)" fill="url(#cAg)" stroke="#4FD6B4" stroke-opacity="0.75" stroke-width="1.5">
      <rect x="516" y="99" width="210" height="62" rx="14"/>
      <rect x="516" y="179" width="210" height="62" rx="14"/>
      <rect x="516" y="259" width="210" height="62" rx="14"/>
      <rect x="516" y="339" width="210" height="62" rx="14"/>
    </g>
    <g fill="#4FD6B4" fill-opacity="0.16">
      <circle cx="547" cy="130" r="17"/><circle cx="547" cy="210" r="17"/><circle cx="547" cy="290" r="17"/><circle cx="547" cy="370" r="17"/>
    </g>
    <g fill="none" stroke="#4FD6B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(535 118)"><path d="M6 3 H14.5 L19 7.5 V21 H6 Z"/><path d="M9.5 11.5 H15.5 M9.5 15 H15.5 M9.5 18.5 H13"/></g>
      <g transform="translate(535 198)"><path d="M8 7 L3 12 L8 17 M16 7 L21 12 L16 17 M13.5 5 L10.5 19"/></g>
      <g transform="translate(535 278)"><path d="M9 3 H15 M10 3 V9.5 L4.8 19 C4.3 20 5 21 6 21 H18 C19 21 19.7 20 19.2 19 L14 9.5 V3"/><path d="M7.2 15.5 H16.8"/></g>
      <g transform="translate(535 358)"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15 L20.5 20.5"/></g>
    </g>
    <g fill="#ffffff" font-size="17" font-weight="700">
      <text x="574" y="127">lecteur</text>
      <text x="574" y="207">executant</text>
      <text x="574" y="287">testeur</text>
      <text x="574" y="367">chercheur</text>
    </g>
    <g fill="#a9e9d8" font-size="12.5">
      <text x="574" y="146">lit et résume</text>
      <text x="574" y="226">écrit le code décidé</text>
      <text x="574" y="306">lance tests et captures</text>
      <text x="574" y="386">recherche sur le web</text>
    </g>

    <!-- Vérification -->
    <g filter="url(#sh)">
      <rect x="816" y="194" width="154" height="112" rx="16" fill="url(#cNeu)" stroke="#8B7BFF" stroke-opacity="0.8" stroke-width="1.5"/>
    </g>
    <circle cx="893" cy="228" r="19" fill="#4FD6B4" fill-opacity="0.16">
      <animate attributeName="r" values="18;21;18" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M884.5 228.5 L890.5 234.5 L902 222" fill="none" stroke="#4FD6B4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="893" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Vérification</text>
    <text x="893" y="289" text-anchor="middle" font-size="12.5" fill="#c9c4f2">par le fil principal</text>

    <!-- architecte -->
    <g filter="url(#sh)">
      <rect x="196" y="372" width="220" height="72" rx="16" fill="url(#cArc)" stroke="#D97757" stroke-width="2"/>
    </g>
    <circle cx="230" cy="408" r="18" fill="#D97757" fill-opacity="0.18"/>
    <g transform="translate(218 396)" fill="none" stroke="#F0A586" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="6" r="2.2"/><path d="M11 8 L6 21 M13 8 L18 21 M8 16 H16"/>
    </g>
    <text x="260" y="404" font-size="17" font-weight="700" fill="#ffffff">architecte</text>
    <text x="260" y="424" font-size="12.5" fill="#F0A586">Opus · problèmes durs</text>
  </g>

  <!-- légende -->
  <g font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c9c4f2">
    <path d="M516 442 L540 442" stroke="#8B7BFF" stroke-width="2" stroke-linecap="round"/>
    <text x="548" y="446">délégation</text>
    <path d="M632 442 L656 442" stroke="#4FD6B4" stroke-width="2" stroke-linecap="round"/>
    <text x="664" y="446">rapport court</text>
    <path d="M764 442 L788 442" stroke="#D97757" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="796" y="446">appel ponctuel</text>
  </g>

  <!-- impulsions -->
  <g fill="#ffffff" filter="url(#gl)">
    <circle r="3.5"><animateMotion dur="1.6s" repeatCount="indefinite" path="M148 250 L192 250"/><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#cfc8ff" filter="url(#gl)">
    <circle r="3.5"><animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M416 250 C468 250 462 130 512 130"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite" path="M416 250 C468 250 462 210 512 210"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M416 250 C468 250 462 290 512 290"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="2.1s" repeatCount="indefinite" path="M416 250 C468 250 462 370 512 370"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#4FD6B4" filter="url(#gl)">
    <circle r="3.5"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M726 130 C772 130 766 250 812 250"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="2.1s" repeatCount="indefinite" path="M726 210 C772 210 766 250 812 250"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M726 290 C772 290 766 250 812 250"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="3.5"><animateMotion dur="2.8s" begin="0.7s" repeatCount="indefinite" path="M726 370 C772 370 766 250 812 250"/><animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="3.5" fill="#F0A586" filter="url(#gl)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M306 324 L306 368"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>
