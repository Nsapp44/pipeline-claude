<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <!-- Palette commune : fond #12102e > #1f1a5c > #2b1650 · Claude #D97757 / clair #F0A586 · Sonnet #8B7BFF · agents #4FD6B4 · texte #FFFFFF / #C9C4F2 · bordures #3A3480 · coins 14-18 -->
  <title id="t">Pipeline Claude</title>
  <desc id="d">Bannière : Sonnet comme fil principal, des agents qui exécutent, et l'architecte Opus appelé aux déclencheurs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12102e"/>
      <stop offset="0.55" stop-color="#1f1a5c"/>
      <stop offset="1" stop-color="#2b1650"/>
    </linearGradient>
    <linearGradient id="ti" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfc8ff"/>
    </linearGradient>
    <radialGradient id="haloO">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloV">
      <stop offset="0" stop-color="#8B7BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 L0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <path id="star" transform="translate(-45 -45) scale(3.75)" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- halos -->
    <circle cx="170" cy="160" r="170" fill="url(#haloO)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="40" r="240" fill="url(#haloV)">
      <animate attributeName="opacity" values="1;0.55;1" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- grande étincelle en filigrane -->
    <g transform="translate(1085 200) scale(3.4)" fill="#ffffff" opacity="0.04">
      <use href="#star">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- balayage lumineux -->
    <rect x="-320" y="-40" width="260" height="400" fill="url(#sweep)" transform="skewX(-18)">
      <animate attributeName="x" values="-320;1500" dur="10s" repeatCount="indefinite"/>
    </rect>

    <!-- particules -->
    <g fill="#F0A586">
      <circle cx="300" cy="280" r="2"><animate attributeName="cy" values="290;250;290" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="270" r="2"><animate attributeName="cy" values="280;240;280" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#cfc8ff">
      <circle cx="60" cy="60" r="1.8"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="40" r="2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="290" r="2.2"><animate attributeName="cy" values="296;270;296" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="120" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="300" r="1.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- logo -->
    <circle cx="170" cy="160" r="86" fill="none" stroke="#D97757" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 170 160" to="360 170 160" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="160" r="66" fill="#12102e" fill-opacity="0.55" stroke="#D97757" stroke-opacity="0.5" stroke-width="1.5"/>
    <g transform="translate(170 160) scale(1.12)" fill="#D97757">
      <use href="#star"/>
    </g>

    <!-- textes -->
    <g font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <text x="300" y="96" font-size="13" font-weight="700" letter-spacing="3" fill="#F0A586">CONFIGURATION CLAUDE CODE</text>
      <text x="298" y="156" font-size="60" font-weight="800" fill="url(#ti)">Pipeline Claude</text>
      <text x="300" y="194" font-size="21" fill="#c9c4f2">Un modèle qui pense et vérifie, des agents qui exécutent.</text>
    </g>

    <!-- pastilles -->
    <g font-family="system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">
      <g>
        <rect x="300" y="222" width="206" height="40" rx="20" fill="#8B7BFF" fill-opacity="0.16" stroke="#8B7BFF" stroke-opacity="0.7"/>
        <circle cx="322" cy="242" r="5" fill="#8B7BFF"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
        <text x="338" y="247.5">Sonnet · fil principal</text>
      </g>
      <g>
        <rect x="518" y="222" width="246" height="40" rx="20" fill="#4FD6B4" fill-opacity="0.14" stroke="#4FD6B4" stroke-opacity="0.7"/>
        <circle cx="540" cy="242" r="5" fill="#4FD6B4"><animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
        <text x="556" y="247.5">Agents · lire, écrire, tester</text>
      </g>
      <g>
        <rect x="778" y="222" width="182" height="40" rx="20" fill="#D97757" fill-opacity="0.18" stroke="#D97757" stroke-opacity="0.8"/>
        <circle cx="800" cy="242" r="5" fill="#F0A586"><animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
        <text x="816" y="247.5">Architecte · Opus</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
